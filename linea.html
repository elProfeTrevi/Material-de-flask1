<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea de Tiempo Tecnológica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #1a202c;
            overflow-x: hidden;
        }
        .timeline-container {
            position: relative;
            overflow-x: auto;
            white-space: nowrap;
            padding: 4rem 0;
            cursor: grab;
            user-select: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .timeline-container::-webkit-scrollbar {
            display: none;
        }
        .timeline {
            display: inline-block;
            height: 4px;
            background-color: #d1d5db;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }
        .timeline-event {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 3rem;
            height: 3rem;
            background-color: #cbd5e0;
            border-radius: 9999px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #6b7280;
        }
        .timeline-event:hover {
            transform: translate(-50%, -50%) scale(1.2);
            background-color: #6b7280;
        }
        .timeline-event-label {
            position: absolute;
            top: -2rem;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.875rem;
            font-weight: 600;
            color: #4b5563;
        }
        .info-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 28rem;
            height: 100%;
            background-color: #ffffff;
            z-index: 50;
            transition: right 0.4s ease-in-out;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            padding: 2rem;
        }
        .info-panel.active {
            right: 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-7xl mx-auto w-full text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-2">Tu Vida Conectada</h1>
        <p class="text-base sm:text-lg text-gray-600 mb-8">Un Viaje por la Evolución Digital</p>
    </div>

    <div id="timeline-container" class="timeline-container w-full max-w-7xl relative mx-auto">
        <div id="timeline-line" class="timeline"></div>
        <!-- Events will be dynamically generated by JavaScript -->
    </div>

    <!-- Info Panel -->
    <div id="info-panel" class="info-panel">
        <button id="close-panel" class="absolute top-4 left-4 text-gray-500 hover:text-gray-900 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <h2 id="panel-title" class="text-2xl font-bold text-gray-800 mb-4 mt-8"></h2>
        <p id="panel-text" class="text-gray-700 leading-relaxed mb-6"></p>
        <div id="panel-image-container" class="w-full h-48 bg-gray-200 rounded-lg mb-4 flex items-center justify-center overflow-hidden">
            <img id="panel-image" src="" alt="" class="w-full h-full object-cover">
        </div>
        <p id="panel-analogy" class="text-sm text-gray-500 font-medium italic"></p>
    </div>

    <script>
        const eventsData = [
            {
                year: 1947,
                title: 'El Transistor',
                text: 'El transistor fue un componente electrónico diminuto que revolucionó todo. Antes, las computadoras usaban bulbos enormes y calientes. El transistor hizo posible hacer las cosas más pequeñas y eficientes.',
                analogy: 'El "mini-ladrillo" de la construcción digital.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=Transistor'
            },
            {
                year: 1971,
                title: 'El Microprocesador',
                text: 'Imaginen un "cerebro" completo en un solo chip. El microprocesador puso toda la unidad de procesamiento de una computadora en un circuito integrado, haciendo que las máquinas fueran mucho más poderosas y compactas.',
                analogy: 'El "cerebro" del edificio tecnológico.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=Microprocesador'
            },
            {
                year: 1977,
                title: 'PC',
                text: 'Con el microprocesador, la computación salió de los laboratorios y llegó a los hogares. La PC democratizó el acceso a la tecnología, permitiendo que cualquiera pudiera tener una máquina potente en su escritorio.',
                analogy: 'La "base" del edificio, accesible para todos.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=PC+Personal'
            },
            {
                year: 1983,
                title: 'El Internet',
                text: 'La red de redes que conectó a todas las computadoras del mundo. El internet es la infraestructura que permite la comunicación global instantánea, el intercambio de información y la creación de comunidades virtuales.',
                analogy: 'El "puente mundial" que lo conecta todo.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=Internet'
            },
            {
                year: 2007,
                title: 'El Smartphone',
                text: 'El teléfono inteligente fue el punto de inflexión. No solo nos permitió comunicarnos, sino que fusionó en un solo dispositivo una computadora, una cámara, un reproductor de música y un navegador GPS.',
                analogy: 'La "llave" que abrió el ecosistema digital.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=Smartphone'
            },
            {
                year: 2010,
                title: 'La Nube y el IoT',
                text: 'La capacidad de guardar y acceder a datos desde cualquier lugar (la nube) y la interconexión de objetos cotidianos (Internet de las Cosas) permitieron que la tecnología saliera del smartphone y llegara a nuestros hogares, autos y wearables.',
                analogy: 'El "cableado" invisible del edificio.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=IoT+%26+Nube'
            },
            {
                year: 2015,
                title: 'Inteligencia Artificial',
                text: 'La IA es la "mente" que potencia la tecnología actual. Desde algoritmos que sugieren qué ver en Netflix, hasta asistentes de voz como Siri y Google Assistant. La IA aprende y se adapta para hacernos la vida más fácil.',
                analogy: 'El "cerebro" que piensa por sí mismo.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=Inteligencia+Artificial'
            },
            {
                year: 2022,
                title: 'IA Generativa',
                text: 'Una evolución de la IA que puede crear contenido original. Modelos como ChatGPT para textos o Midjourney para imágenes han demostrado la capacidad de las máquinas para generar arte, escribir código y componer música.',
                analogy: 'La "creatividad" del cerebro digital.',
                image: 'https://placehold.co/400x300/4F46E5/ffffff?text=IA+Generativa'
            }
        ];

        const timelineContainer = document.getElementById('timeline-container');
        const timelineLine = document.getElementById('timeline-line');
        const infoPanel = document.getElementById('info-panel');
        const closePanelBtn = document.getElementById('close-panel');
        const panelTitle = document.getElementById('panel-title');
        const panelText = document.getElementById('panel-text');
        const panelImage = document.getElementById('panel-image');
        const panelAnalogy = document.getElementById('panel-analogy');

        // Dynamically create events and set line width
        const eventWidth = 150; // Spacing between events
        const totalWidth = (eventsData.length - 1) * eventWidth;
        timelineLine.style.width = `${totalWidth}px`;
        
        eventsData.forEach((event, index) => {
            const eventElement = document.createElement('div');
            eventElement.className = 'timeline-event';
            eventElement.style.left = `${(index * eventWidth) + 120}px`; // Add offset for a starting point

            eventElement.innerHTML = `
                <span class="text-xs font-bold text-gray-900">${event.year}</span>
                <span class="timeline-event-label">${event.title}</span>
            `;
            
            eventElement.addEventListener('click', () => {
                showPanel(event);
            });
            timelineContainer.appendChild(eventElement);
        });

        function showPanel(event) {
            panelTitle.textContent = event.title;
            panelText.textContent = event.text;
            panelImage.src = event.image;
            panelImage.alt = event.title;
            panelAnalogy.textContent = event.analogy;
            infoPanel.classList.add('active');
        }

        closePanelBtn.addEventListener('click', () => {
            infoPanel.classList.remove('active');
        });

        // Add drag-to-scroll functionality
        let isDown = false;
        let startX;
        let scrollLeft;

        timelineContainer.addEventListener('mousedown', (e) => {
            isDown = true;
            timelineContainer.classList.add('active');
            startX = e.pageX - timelineContainer.offsetLeft;
            scrollLeft = timelineContainer.scrollLeft;
        });
        timelineContainer.addEventListener('mouseleave', () => {
            isDown = false;
            timelineContainer.classList.remove('active');
        });
        timelineContainer.addEventListener('mouseup', () => {
            isDown = false;
            timelineContainer.classList.remove('active');
        });
        timelineContainer.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - timelineContainer.offsetLeft;
            const walk = (x - startX) * 2; //scroll-fast
            timelineContainer.scrollLeft = scrollLeft - walk;
        });

    </script>

</body>
</html>
